# Settings that apply to the whole Gradle build.

# Memory for the long-lived Gradle daemon. Android builds need more than the default.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build independent modules in parallel, and skip work whose inputs have not changed.
org.gradle.parallel=true
org.gradle.caching=true

# Use the modern AndroidX support libraries rather than the long-dead original ones.
android.useAndroidX=true

# Each module gets its own R class instead of one giant merged one — smaller and faster.
android.nonTransitiveRClass=true

# Follow the official Kotlin formatting conventions.
kotlin.code.style=official

# Gradle's per-project cache, normally written to .gradle/ next to the sources.
# Moved off Google Drive for the same reason as the build output: the sources live on
# Drive, and this directory is rewritten on every build.
#
# ssd_cache is the designated local scratch area, and is treated as disposable: deleting
# it costs nothing but a slower next build. Do not use C:\Users\davel\data instead - that
# looks local but is a junction pointing straight back at G:\My Drive\dave_data, so
# anything written there lands on Drive after all.
#
# MACHINE-SPECIFIC. Gradle can only read this from a properties file, not from the
# gitignored local.properties, so it has to sit here in the open - change the path
# (or delete these lines) on any other machine.
#
# The drive-letter colon must be escaped: .properties treats ':' as a key/value
# separator, so an unescaped one is a lint error (PropertyEscape) even in a value.
org.gradle.projectcachedir=C\:/Users/davel/ssd_cache/AndroidBuilds/TalkRPN/gradle-cache

# The Kotlin plugin keeps its own per-project scratch state, normally in .kotlin/ next to
# the sources. Same treatment, same reason - it is regenerated and does not belong on Drive.
kotlin.project.persistent.dir=C\:/Users/davel/ssd_cache/AndroidBuilds/TalkRPN/kotlin
